name: Build IPA

on:
  push:
    branches: [claude/serene-goldberg-apdaw9, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Engine tests
        run: |
          swiftc -O Squareszn/Engine.swift Tests/main.swift -o enginetests
          ./enginetests

      # Unsigned build: the IPA gets signed with your own Apple ID
      # when you install it (for example with Sideloadly or AltStore).
      - name: Build app
        run: |
          xcodebuild \
            -project Squareszn.xcodeproj \
            -target Squareszn \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Squareszn.app Payload/
          zip -qry Squareszn.ipa Payload
          ls -lh Squareszn.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Squareszn-ipa
          path: Squareszn.ipa
          retention-days: 30
